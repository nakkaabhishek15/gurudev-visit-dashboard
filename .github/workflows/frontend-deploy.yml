name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "terraform/scripts/deploy_frontend.sh"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: frontend-prod
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ca-central-1
  # Replace with the value of `tofu output -raw github_actions_frontend_role_arn`
  # after the first apply.
  AWS_ROLE_TO_ASSUME: arn:aws:iam::716156543359:role/gurudev-prod-github-frontend-deploy

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: gurudev-frontend-${{ github.run_id }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Initialize OpenTofu state
        working-directory: terraform/envs/prod
        run: tofu init -backend-config=backend.hcl.example -input=false

      - name: Publish to S3 and invalidate CloudFront
        env:
          SKIP_FRONTEND_BUILD: "true"
          WAIT_FOR_CLOUDFRONT_INVALIDATION: "true"
        run: terraform/scripts/deploy_frontend.sh
