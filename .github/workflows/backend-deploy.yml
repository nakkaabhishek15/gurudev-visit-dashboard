name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "terraform/scripts/deploy_backend.sh"
      - "terraform/scripts/deploy_backend_service.sh"
      - "terraform/scripts/run_backend_migrations.sh"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: backend-prod
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ca-central-1
  # Replace with the value of `tofu output -raw github_actions_backend_role_arn`
  # after the first apply.
  AWS_ROLE_TO_ASSUME: arn:aws:iam::716156543359:role/gurudev-prod-github-backend-deploy

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: gurudev-backend-${{ github.run_id }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Initialize OpenTofu state
        working-directory: terraform/envs/prod
        run: tofu init -backend-config=backend.hcl.example -input=false

      - name: Build, migrate, and roll the service
        run: terraform/scripts/deploy_backend_service.sh "${GITHUB_SHA}"
